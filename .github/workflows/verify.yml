name: verify

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            internal/web/ui/pnpm-lock.yaml
            .tools/markdown/pnpm-lock.yaml
      - name: Verify Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify.sh
      - name: Verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1
